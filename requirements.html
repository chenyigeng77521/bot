<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMPAK CRM 需求跟踪</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #232733;
  --border: #2d3140;
  --text: #e4e6eb;
  --text-dim: #8b8fa3;
  --text-mute: #5c6175;
  --accent: #3b82f6;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 14px;
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
}
.header-title {
  font-size: 20px; font-weight: 700; margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.header-title .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.header-hint {
  font-size: 12px; color: var(--text-mute); margin-bottom: 14px;
}

/* Status cards */
.status-cards {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.status-card {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  background: var(--surface2);
  user-select: none;
}
.status-card:hover { transform: translateY(-1px); }
.status-card.active { border-width: 2px; }
.status-card .count {
  font-size: 18px; font-weight: 700;
}
.status-card .label { font-size: 13px; color: var(--text-dim); }

/* Filter bar */
.filter-bar {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.filter-bar input {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
  flex: 1; min-width: 200px;
}
.filter-bar input:focus { border-color: var(--accent); }
.filter-bar input::placeholder { color: var(--text-mute); }
.filter-bar select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  cursor: pointer;
}
.result-count {
  font-size: 13px; color: var(--text-dim);
  white-space: nowrap;
}

/* Requirement list */
.req-list {
  padding: 16px 24px 40px;
  max-width: 1200px; margin: 0 auto;
}
.req-item {
  margin-bottom: 6px;
  border-radius: 8px;
  overflow: hidden;
  transition: background 0.15s;
}
.req-item:hover { background: var(--surface); }

.req-header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
}
.req-header:hover { background: var(--surface2); }
.req-num {
  font-size: 12px; font-weight: 600;
  color: var(--text-mute);
  min-width: 36px; text-align: right;
  font-family: "SF Mono", "Fira Code", monospace;
}
.req-status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.req-title {
  flex: 1; font-size: 14px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.req-status-badge {
  font-size: 11px; padding: 2px 8px;
  border-radius: 4px; font-weight: 600;
  white-space: nowrap;
}
.req-chevron {
  color: var(--text-mute); font-size: 12px;
  transition: transform 0.2s;
}
.req-item.open .req-chevron { transform: rotate(90deg); }

/* Detail panel */
.req-detail {
  display: none;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-top: 4px;
  margin-left: 62px;
}
.req-item.open .req-detail { display: block; }

.detail-section {
  margin-bottom: 16px;
}
.detail-section:last-child { margin-bottom: 0; }
.detail-section-title {
  font-size: 12px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.detail-section-title::before {
  content: ""; width: 3px; height: 12px; border-radius: 2px;
}
.detail-section.branches .detail-section-title::before { background: #3b82f6; }
.detail-section.tables .detail-section-title::before { background: #f97316; }
.detail-section.config .detail-section-title::before { background: #a855f7; }
.detail-section.raw .detail-section-title::before { background: #6b7280; }

.branch-list {
  display: flex; flex-direction: column; gap: 4px;
}
.branch-item {
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 12px;
  padding: 6px 10px;
  background: var(--surface2);
  border-radius: 6px;
  border-left: 3px solid #3b82f6;
  word-break: break-all;
}

.sql-block {
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 12px;
  padding: 10px 14px;
  background: #0d0f14;
  border-radius: 6px;
  border: 1px solid var(--border);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
  max-height: 400px;
  overflow-y: auto;
}
.sql-block::-webkit-scrollbar { width: 6px; height: 6px; }
.sql-block::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.raw-content {
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 12px;
  padding: 12px 16px;
  background: #0d0f14;
  border-radius: 6px;
  border: 1px solid var(--border);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
  max-height: 500px;
  overflow-y: auto;
  color: var(--text-dim);
}
.raw-content::-webkit-scrollbar { width: 6px; height: 6px; }
.raw-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.no-data {
  font-size: 12px; color: var(--text-mute); font-style: italic;
}

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-mute);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .req-list { padding: 12px 16px 40px; }
  .req-detail { margin-left: 0; }
  .status-cards { gap: 8px; }
  .status-card { padding: 6px 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <span class="dot"></span>
    CMPAK CRM 需求跟踪
  </div>
  <div class="header-hint">
    状态说明：已上线/未上线 = 部署维度 &nbsp;|&nbsp; 开发完成/开发中/未开始 = 开发维度 &nbsp;|&nbsp; 开发完成包含已上线+未上线中已完成的
  </div>
  <div class="status-cards" id="statusCards">
    
    <div class="status-card" data-status="live" onclick="toggleStatusFilter('live')">
      <span class="count" style="color: #22c55e" id="count-live">0</span>
      <span class="label">已上线</span>
    </div>
    <div class="status-card" data-status="not_live" onclick="toggleStatusFilter('not_live')">
      <span class="count" style="color: #f97316" id="count-not_live">0</span>
      <span class="label">未上线</span>
    </div>
    <div class="status-card" data-status="dev_done" onclick="toggleStatusFilter('dev_done')">
      <span class="count" style="color: #a855f7" id="count-dev_done">0</span>
      <span class="label">开发完成</span>
    </div>
    <div class="status-card" data-status="developing" onclick="toggleStatusFilter('developing')">
      <span class="count" style="color: #3b82f6" id="count-developing">0</span>
      <span class="label">开发中</span>
    </div>
    <div class="status-card" data-status="not_started" onclick="toggleStatusFilter('not_started')">
      <span class="count" style="color: #6b7280" id="count-not_started">0</span>
      <span class="label">未开始</span>
    </div>
    <div class="status-card" data-status="all" onclick="toggleStatusFilter('all')" style="border-color: var(--accent);">
      <span class="count" style="color: var(--accent)" id="count-all">0</span>
      <span class="label">全部</span>
    </div>
  </div>
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="搜索关键字（需求名称、分支、SQL内容等）..." oninput="applyFilters()">
    <input type="number" id="numInput" placeholder="按编号筛选" style="max-width: 140px;" oninput="applyFilters()">
    <select id="statusFilter" onchange="applyFilters()">
      <option value="all">全部状态</option>
      <option value="live">已上线</option><option value="not_live">未上线</option><option value="dev_done">开发完成</option><option value="developing">开发中</option><option value="not_started">未开始</option>
    </select>
    <span class="result-count" id="resultCount"></span>
  </div>
</div>

<div class="req-list" id="reqList"></div>

nfo.sec.exeprocess.task.LockOperatorTimeOutTask\ncreate table SEC.SEC_BLOCK_OPERATOR_FILTER\n\n(\n\n    OP_ID      NUMBER(12)  ,\n\n    OPERATOR_ID NUMBER(12)    not null,\n\n    CODE        VARCHAR2(60)  not null,\n\n    STAFF_ID    NUMBER(12)    not null,\n\n    STATE      NUMBER(12),\n\n    STAFF_NAME  VARCHAR2(200) not null,\n\n    VALID_DATE  DATE,\n\n    EXPIRE_DATE DATE,\n\n    STATUS      NUMBER(4),\n\n    REMARK      CHAR(100)\n\n)"}, {"id": 24, "origNum": "23", "title": "删除stp指令", "deployStatus": "live", "devStatus": "dev_done", "displayStatus": "live", "branches": [], "tableChanges": [], "configParams": ["update  sec.SEC_FUNCTION set DLL_PATH=DLL_PATH||'&listener=onInitBusi' where name like '%RN Defination%';", "INSERT INTO SEC.SEC_PRIV (PRIV_ID, PRIV_NAME, ENT_CLASS_ID, PRIV_DESC, CATA_ID, STATE, DONE_CODE, CREATE_DATE,"], "details": "23 删除stp指令\n \n刷一下search\n \n这个权限不在初始化做了\nupdate  sec.SEC_FUNCTION set DLL_PATH=DLL_PATH||'&listener=onInitBusi' where name like '%RN Defination%';\n\nINSERT INTO SEC.SEC_PRIV (PRIV_ID, PRIV_NAME, ENT_CLASS_ID, PRIV_DESC, CATA_ID, STATE, DONE_CODE, CREATE_DATE,\n                          DONE_DATE, VALID_DATE, EXPIRE_DATE, OP_ID, ORG_ID)\nVALUES ('3650011', 'Delete Stp Info', 3, 'Delete Stp Info', '2600', 1, null, null, null,\n        TO_DATE('2019-12-09 15:29:44', 'YYYY-MM-DD HH24:MI:SS'),\n        TO_DATE('2050-12-31 23:59:59', 'YYYY-MM-DD HH24:MI:SS'), null, null);"}, {"id": 25, "origNum": "24", "title": "Retailer SIM Blocking/Deblocking API (BVS)", "deployStatus": "live", "devStatus": "dev_done", "displayStatus": "live", "branches": ["feature/20221111/RetailerSIMBlocking|app&web&et|@feature/20221111/RetailerSIMBlocking@feature/20221111/RetailerSIMBlocking:chenyg@order"], "tableChanges": [], "configParams": ["INSERT INTO BASE.BS_PARA_DETAIL (REGION_ID, PARA_TYPE, PARA_CODE, PARA_NAME, PARA1, PARA2, PARA3, PARA4, PARA5,", "INSERT INTO BASE.RF_SCENE (SCENE_ID, TENANT_ID, BASE_ID, CATALOG_ID, SCENE_CODE, SCENE_NAME, SCENE_D "displayStatus": "live", "branches": [], "tableChanges": [], "configParams": [], "details": "27 Re: BOSS-2022-122-Zong Dost Application Two Verify APIs\n \n \n \n      请参照下面邮件要求，增加Retailer/RSO EPIN code的验证函数，验证通过则返回对应的信息。（如果passwword没设置，并且输入的组织存在，则直接返回要求的信息） 请有时间提前开发，不用等用户工作量确认\n \n \n \n \n \n \n \n \n \n \n \n \n@Service(\n        serviceCode = \"order.Dost.IDostOtpCSV.FranchisePasswordVerify\",\n        name = \"FranchisePasswordVerify\",\n        desc = \"校验franchise 操作员密码\",\n        inMsg = @Msg(params = {\n                @Param(name = \"OPERATOR_ID\",desc = \"franchise 操作员ID\", type = ParamType.STRING, nullable = NullAbleType.NO),\n                @Param(name = \"PASSWORD\",desc = \"franchise 密码\", type = ParamType.STRING, nullable = NullAbleType.NO)\n        }),\n        outMsg = @Msg(params = {\n                @Param(name = \"VERIFY_RESULT\",desc = \"校验结果 Y 成功 N 失败\", type = ParamType.STRING),\n                @Param(name = \"VERIFY_DESC\",desc = \"校验结果描述\", type = ParamType.STRING),\n                @Param(name = \"VERIFY_CODE\",desc = \"校验码\", type = ParamType.STRING),\n                @Param(name = \"OPERATOR_MSISDN\",desc = \"手机号码\", type = ParamType.STRING),\n                @Param(name = \"FRANCHISE_REGION\",desc = \"地区名\", type = ParamType.STRING)\n        })\n \n)\nMap<String, Object> FranchisePasswordVerify(Map<String, Object> request) throws Exception;\n\n@Service(\n        serviceCode = \"order.Dost.IDostOtpCSV.RetailerEpinVerify\",\n        name = \"RetailerEpinVerify\",\n        desc = \"校验retailer Epin\",\n        inMsg = @Msg(params = {\n                @Param(name = \"RETAILER_MSISDN\",desc = \"retailer 号码\", type = ParamType.STRING, nullable = NullAbleType.NO),\n                @Param(name = \"PASSWORD\",desc = \"franchise 密码\", type = ParamType.STRING, nullable = NullAbleType.NO)\n        }),\n        outMsg = @Msg(params = {\n                @Param(name = \"VERIFY_RESULT\",desc = \"校验结果 Y 成功 N 失败\", type = ParamType.STRING),\n                @Param(name = \"VERIFY_DESC\",desc = \"校验结果描述\", type = ParamType.STRING),\n                @Param(name = \"VERIFY_CODE\",desc = \"校验码\", type = ParamType.STRING),\n                @Param(name = \"RETAILER_MSISDN\",desc = \"retailer 手机号码\", type = ParamType.STRING),\n                @Param(name = \"RSO_MSISDN\",desc = \"RSO 手机号码\", type = ParamType.STRING),\n                @Param(name = \"RSO_ID\",desc = \"RSO 组织ID\", type = ParamType.STRING),\n                @Param(name = \"SECOND_PARENT_REGION\",desc = \"FR归属地区\", type = ParamType.STRING),\n                @Param(name = \"SECOND_PARENT_ID\",desc = \"FR 组织ID\", type = ParamType.STRING),\n                @Param(name = \"RETAILER_ID\",desc = \"RETAILER ID\", type = ParamType.STRING)\n        })\n \n)\nMap<String, Object> RetailerEpinVerify(Map<String, Object> request) throws Exception;\n\n@Service(\n        serviceCode = \"order.Dost.IDostOtpCSV.RSOEpinVerify\",\n        name = \"RSOEpinVerify\",\n        desc = \"校验RSO epin\",\n        inMsg = @Msg(params = {\n                @Param(name = \"RSO_MSISDN\",desc = \"rso 号码\", type = ParamType.STRING, nullable = NullAbleType.NO),\n                @Param(name = \"PASSWORD\",desc = \"franchise 密码\", type = ParamType.STRING, nullable = NullAbleType.NO)\n        }),\n        outMsg = @Msg(params = {\n                @Param(name = \"VERIFY_RESULT\",desc = \"校验结果 Y 成功 N 失败\", type = ParamType.STRING),\n                @Param(name = \"VERIFY_DESC\",desc = \"校验结果描述\", type = ParamType.STRING),\n                @Param(name = \"VERIFY_CODE\",desc = \"校验码\", type = ParamType.STRING),\n                @Param(name = \"RSO_MSISDN\",desc = \"RSO 手机号码\", type = ParamType.STRING),\n                @Param(name = \"RSO_ID\",desc = \"RSO 组织ID\", type = ParamType.STRING),\n                @Param(name = \"SECOND_PARENT_REGION\",desc = \"FR归属地区\", type = ParamType.STRING),\n                @Param(name = \"SECOND_PARENT_ID\",desc = \"FR 组织ID\", type = ParamType.STRING),\n        })\n \ 数。\n一赓参照Channel中心创建，修改，查询功能。封装创建，修改，查询3个给OSP调用Dost API接口.\n封装的Dost API接口在调用Channel中心的实际业务接口前需要完成必要的数据有效性检查。\n查询和修改操作需要支持基于channel id，busi hall id，ML Number 3个信息来确定实际的组织\n封装的创建，修改Dost API需要支持第3方输入文档上传时OSP返回的注册ID，通过ID调用文件信息查询接口获取用户实际上传的文件信息。\n海军调用order.IOrderServiceCSV.registerFleUpload接口完成OSP侧上传文档登记， 该接口完成返回一个唯一标识，这个ID需要返回给vendor，vendor后续调用业务接口的时候传人这个ID，来标识和业务相关的文档上传信息\n \norder.IOrderServiceCSV.registerFleUpload\norder.IOrderServiceCSV.registerFleUpload"}, {"id": 81, "origNum": "73", "title": "frozen/unfrozen记录历史表", "deployStatus": "live", "devStatus": "dev_done", "displayStatus": "live", "branches": ["feature/20240912/store_frozen_action|app|@feature/20240912/store_frozen_action@feature/20240912/store_frozen_action:chenyg@channel"], "tableChanges": [], "configParams": [], "details": "73 增加 frozen / unfrozen 记录历史表，并修改done date 没更新的bug\nfeature/20240912/store_frozen_action|app|@feature/20240912/store_frozen_action@feature/20240912/store_frozen_action:chenyg@channel"}, {"id": 82, "origNum": "74", "title": "BOSS-2024-108 Modification API for DMS Device Mapping", "deployStatus": "live", "devStatus": "dev_done", "displayStatus": "live", "branches": ["feature/20241017/new_api_for_retailer|app&web|@feature/20241017/new_api_for_retailer@feature/20241017/new_api_for_retailer:chenyg@order"], "tableChanges": [], "configParams": [], "details": "74 开发任务安排： BOSS-2024-108-Modification API for DMS Device Mapping-AI\nfeature/20241017/new_api_for_retailer|app&web|@feature/20241017/new_api_for_retailer@feature/20241017/new_api_for_retailer:chenyg@order"}, {"id": 83, "origNum": "75", "title": "调用接口返回为空继续执行", "deployStatus": "live", "devStatus": "dev_done", "displayStatus": "live", "branches": ["bugfix/20241010/go_on_execute|app|@bugfix/20241010/go_on_execute@bugfix/20241010/go_on_execute:chenyg@order"], "tableChanges": [], "configParams": [], "details": "75  调用接口返回为空，继续执行其他检查\nbugfix/20241010/go_on_execute|app|@bugfix/20241010/go_on_execute@bugfix/20241010/go_on_execute:chenyg@order"}, ils": "##### 91 Numbering_Series_Definition\n\n* 和第90个需求有冲突 stage 目前只放了第90个,初始化的时候zong 的号码信息直接从号段取，不在从 cp number location 表取\n\n \n```\n BOSS-2025-104-371 Numbering Series Definition (Onnet / MNP Base)\n \nfeature/20250901/Numbering_Series_Definition|app&web|@feature/20250901/Numbering_Series_Definition@feature/20250901/Numbering_Series_Definition:chenyg@order\n\n```"}, {"id": 100, "origNum": "92", "title": "Automation of Password Setting for Retailer/RSO Account", "deployStatus": "live", "devStatus": "dev_done", "displayStatus": "live", "branches": ["feature/20250909/add_some_busi_log|app&web|@feature/20250909/add_some_busi_log@feature/20250909/add_some_busi_log:chenyg@channel", "feature/20250925/add_some_busi_log|app|@feature/20250925/add_some_busi_log@feature/20250925/add_some_busi_log:chenyg@order"], "tableChanges": ["create table QD.CHANNEL_BUSI_LOG"], "configParams": ["INSERT INTO BASE.WD_M_ASYNCTASK (TASK_ID, TASK_NAME, DESTINATION, CLASS_NAME, TIMEOUT_SECOND, STATE, SUBSYS_CODE, REMARKS, AUTHOR)", "INSERT INTO SEC.SEC_FUNCTION (FUNC_ID, ENT_CLASS_ID, FUNC_CODE, NAME, DOMAIN_ID, NOTES, PARENT_ID, FUNC_LEVEL, FUN_SEQ, VIEWNAME, DLL_PATH, FUNC_IMG, FUNC_ARG, FUNC_TYPE, VERIFY_MODE, LOGIN_MODE, BUSI_TYPE, BUSI_SCENE, MODULE_TYPE, MODULE_ENT_ID, HELP_URL, ENTRANCE, DISP_TYPE, AUDIT_LEVEL, AUDIT_FLAG, STATE, EXT1, EXT2, DONE_CODE, CREATE_DATE, CREATOR_ID, DONE_DATE, VALID_DATE, EXPIRE_DATE, OP_ID, ORG_ID)"], "details": "##### 92 Automation of Password SettingforRetailerandRSOAccount Creation in CRM/AI\n\n```\n记得发一下 search ，增加新菜单\nfeature/20250909/add_some_busi_log|app&web|@feature/20250909/add_some_busi_log@feature/20250909/add_some_busi_log:chenyg@channel\n\nfeature/20250925/add_some_busi_log|app|@feature/20250925/add_some_busi_log@feature/20250925/add_some_busi_log:chenyg@order\n\nINSERT INTO BASE.WD_M_ASYNCTASK (TASK_ID, TASK_NAME, DESTINATION, CLASS_NAME, TIMEOUT_SECOND, STATE, SUBSYS_CODE, REMARKS, AUTHOR)\nVALUES (202509291113, '渠道操作日志记录导出', 'cluster-app-impexp', 'com.asiainfo.channel.soa.task.history.ChannelBusiLogExportTask', 300, 'U', 'channel', '渠道操作日志记录导出', 'chenyg');\n\nINSERT INTO SEC.SEC_FUNCTION (FUNC_ID, ENT_CLASS_ID, FUNC_CODE, NAME, DOMAIN_ID, NOTES, PARENT_ID, FUNC_LEVEL, FUN_SEQ, VIEWNAME, DLL_PATH, FUNC_IMG, FUNC_ARG, FUNC_TYPE, VERIFY_MODE, LOGIN_MODE, BUSI_TYPE, BUSI_SCENE, MODULE_TYPE, MODULE_ENT_ID, HELP_URL, ENTRANCE, DISP_TYPE, AUDIT_LEVEL, AUDIT_FLAG, STATE, EXT1, EXT2, DONE_CODE, CREATE_DATE, CREATOR_ID, DONE_DATE, VALID_DATE, EXPIRE_DATE, OP_ID, ORG_ID)\nVALUES (60000104, 6, '60000104', 'Channel Busi Log', 6, 'Channel Busi Log', 60000001, 4, null, 'Query Channel Busi Log', '/web-channel/channel?service=page/channel.page.biz.channel.history.QueryChannelBusiLog&listener=init', 'img1139.gif', null, '2', null, null, null, null, null, null, null, null, null, null, null, 1, null, null, null,Sysdate, null,Sysdate,Sysdate,Sysdate + 3650, 12069,90070004);\n\n功能点： \n（1） Etop account自动生成pin code，并发送给retailer短信，把设置密码点框删除\n（2）登记组织相关的动作来源，修改，创建服务调用，增加 action source\n（3）增加新的business type 记录etop 账户 frozen / unfrozen 和 reason\n（4）增加新的business type 记录代理商，号码变更，修改，密码 修改，重置\n（5）修改 Agent History Query ，增加 action type 和 remarks，导出 agent history result ，包括 include  action type and action remarks，\n修改查询结果，返回  return related action type and action remaks\n\nCHANNEL_AGENT_ADD_NEW_AGENT(\"100001\",\"Add new agent\"),\nCHANNEL_AGENT_UPDATE_PARENT_CHANNEL(\"100002\",\"Update parent channel\"),\nCHANNEL_AGENT_PRE_DISABLE_CHANNEL(\"100003\",\"Pre disable channel\"),\nCHANNEL_AGENT_DISABLE_CHANNEL(\"100004\",\"Disable channel\"),\nCHANNEL_AGENT_RESTORE_CHANNEL(\"100005\",\"Restore channel\"),\nCHANNEL_AGENT_MODIFY_BASIC_INFO(\"100006\",\"Modify channel basic info\"),\nCHANNEL_AGENT_ADD_NEW_DEPT(\"100007\",\"Add new department\"),\n\nCHANNEL_CONTACT_ADD_NEW_CONTACT(\"200001\",\"Add new agent contact\"),\nCHANNEL_CONTACT_DELETE_CONTACT(\"200002\",\"Delete agent contact\"),\nCHANNEL_CONTACT_MODIFY_CONTACT(\"200002\",\"Modify agent contact\"),\n\nCHANNEL_ACCOUNT_ADD_NEW_ETOP_ACCOUNT(\"300001\",\"Add new etop account\"),\nCHANNEL_ACCOUNT_DELETE_NEW_ETOP_ACCOUNT(\"300002\",\"Delete etop account\"),\nCHANNEL_ACCOUNT_SET_NEW_ETOP_ACCOUNT(\"300003\",\"Set new etop account\"),//当只有credit账户的时候，可以单独设置etop账户\nCHANNEL_ACCOUNT_ADD_NEW_CREDIT_ACCOUNT(\"300004\",\"Add new credit account\"),\nCHANNEL_ACCOUNT_SET_NEW_CREDIT_ACCOUNT(\"300005\",\"Set new credit account\"),//当只有eto账户的时候，可以单独设置credit账户，有credit账户不能删除\nCHANNEL_ACCOUNT_ADD_NEW_ETOP_AND_ACCOUNT(\"300006\",\"Add new etop and credit account\"),\nCHANNEL_ACCOUNT_ADJUST_CREDIT_LIMIT_PERCENTAGE(\"300007\",\"Adjust credit limit percentage\"),//在这个百分比是针对security deposit,security deposit乘以这个值等于credit limit\nCHANNEL_ACCOUNT_ADJUST_SECURITY_DEPOSIT(\"300008\",\"Adjust security deposit amount\"),//调整security deposit 的值\nCHANNEL_ACCOUNT_MODIFY_ETOP_PASSWORD(\"300009\",\"Modify etop account password\"),\nCHANNEL_ACCOUNT_RESET_ETOP_PASSWORD(\"300010\",\"Reset etop account password\"),\nCHANNEL_ACCOUNT_FREEZE_ETOP_ACCOUNT(\"300011\",\"Freeze etop account\"),\nCHANNEL_ACCOUNT_UNFREEZE_ETOP_ACCOUNT(\"300012\",\"UnFreeze etop account\"),\nCHANNEL_ACCOUNT_UPDATE_SIM_REPLACE_OPTION(\"300013\",\"Update sim replace option\"),\nCHANNEL_ACCOUNT_UPDATE_SIM_ACTIVATION_OPTION(\"300014\",\"Update sim replace option\"),\nCHANNEL_ACCOUNT_UPDATE_ACCOUNT_RANK(\"300015\",\"Update account rank\"),\nCHANNEL_ACCOUNT_UPDATE_ETOP_MSISDN(\"300016\",\"Update etop account msisdn\");\n\n一 业务记录表\n\ncreate table QD.CHANNEL_BUSI_LOG\n(\n    CHANNEL_ID            NUMBER(10)    not null,\n        PARTITION_ID          NUMBER(2)     not null,\n    BUSINESS_ID           NUMBER(20)    not null\n        constraint PK_BUSINESS_ID_CHANGE_LOG primary key,\n    CONTACT_ID           NUMBER(20)    not null,\n    BUSI_TYPE_ID          VARCHAR2(6)   not null,\n    BUSI_TYPE_NAME        VARCHAR2(200),\n    BUSINESS_TABLE VARCHAR2(100) default '0' not null ,\n    BEFORE_CHANGE        VARCHAR2(4000),\n    AFTER_CHANGE        VARCHAR2(4000),\n    OPERATOR_ID           VARCHAR2(10),\n    ORG_ID                NUMBER(10),\n    DONE_DATE             DATE          not null,\n    ACTION_SOURCE         VARCHAR2(500),\n    ACTION_REASON         VARCHAR2(500),\n    EXT_HOLD        VARCHAR2(4000)\n)\n/\ncreate index IDX_CHANNEL_INFO_CHANNEL_ID on QD.CHANNEL_BUSI_LOG (CHANNEL_ID)\n/\ncreate index IDX_CHANNEL_INFO_CONTACT_ID on QD.CHANNEL_BUSI_LOG (CONTACT_ID)\n/\ncomment on column QD.CHANNEL_BUSI_LOG.BUSI_TYPE_ID is '业务变更类型ID'\n/\ncomment on column QD.CHANNEL_BUSI_LOG.BUSI_TYPE_NAME is '业务变更名称'\n/\ncomment on column QD.CHANNEL_BUSI_LOG.BUSINESS_TABLE is '变更的表名 channel_dept,agent_acc_info'\n/\ncomment on column QD.CHANNEL_BUSI_LOG.ACTION_SOURCE is '变更渠道来源 GUI,API,OSP 等'\n/\n\n二 --渠道组织，账户等相关接口\n\n1） \nsoa.channel.IChannelDeptOperateCSV.addAgent 创建组织\nsoa.channel.IChannelDeptOperateCSV.addOrgDept 创建dept\n\n2）\nsoa.channel.IAgentAccInfoOperateCSV.addAgentAccNoAccId 没有credit的时候，单独创建etop账户\n3）\nchannel.IAgentAccInfoOperateCSV.addEtopAccount 有credit 账户 直接设置 etop\n\n public static String generateRandomSixDigitNumber() throws Exception {\n        Random random = new Random();\nint number = random.nextInt(900000) + 100000; // 生成一个介于100000到999999之间的随机数\nreturn String.valueOf(number);\n}\n\nstrNewPwd= getRandNewPwd(); 当前生成6位随机密码\n\n4）\n AgentAccInfoOperate.chkAgentAccPwd 修改密码  optype =2 重置密码 1 和其他修改密码\n\n5）\nOrderCall.sendSmsToTiOSms(map); 发送短信\n\n6）\nsoa.channel.IChannelDeptOperateCSV.modAgent 修改组织\n\n7）\nchannel.IChannelDeptOperateCSV.addContact 增加联系人\nchannel.IChannelDeptOperateCSV.modContact 修改联系人\nchannel.IChannelDeptOperateCSV.delContact 删除联系人\n\n8）\nTripleDES.encrypt(strNewPwd); 密码加密\n```"}, {"id": 101, "origNum": "93", "title": "patch - 代理商没有信誉度账本增加检查", "deployStatus": "not_live", "devStatus": "dev_done", "displayStatus": "dev_done", "branches": ["* bugfix/20250911/AmountNotCreated|app|@feature/20250911/AmountNotCreated@feature/20250911/AmountNotCreated:chenyg@channel"], "tableChanges NG DOST Business Capability Building:chenyg@order"], "tableChanges": ["ALTER TABLE QD.CHANNEL_BUSI_LOG", "CREATE TABLE CP.CB_RETAILER_SUB_OFFER_DTL"], "configParams": [], "details": "##### 100  <mark>BOSS-2025-075-BOSS-2025-ZONG DOST Business Capability Building</makrk/\n\n\n```\n\n一赓\n\n这个需求开发任务安排你两来完成\n\n一赓实现给retailer号码订购上170促销的功能\n\nRequirement 1: Auto provisioning of 170 on retailer numbers\n\n主要功能：\n针对新增加Retilaer账户设置新Retailer 号码的时候增加一条通知记录\n针对已经存在的Retilaer账户变更Retailer 号码的时候增加一条通知记录\n通知记录至少包含retailer ID，新号码，老号码\n增加一个ET进程，基于通知表对新号码订购上170促销，如果老号码不为空，则对老号码取消170促销。在这个过程中实现一些基本检查规则。针对订购操作，判断号码当前状态是否是retailer 号码，如果不是，则跳过，判断号码是否已经订购上了170产品，如果已经订购了，则跳过。 针对取消操作，如果号码上没有170促销，直接跳过。\n\n```\n\n```\n基于需求 QD.CHANNEL_BUSI_LOG 修改，增加状态字段，默认为0 ，\n增加et 进程处理 etop 号码相关的记录 QD.CHANNEL_BUSI_LOG\n\n    300006\n    300001\n    300002\n    300003\n    300016\nselect * from QD.CHANNEL_BUSI_LOG where BUSINESS_TABLE='QD.AGENT_ACC_INFO' and BUSI_TYPE_ID=300016;\n\n\n```\n\n```\n修改表结构\n\nALTER TABLE QD.CHANNEL_BUSI_LOG\n    ADD (status NUMBER(2) DEFAULT 0,deal_date date ,deal_result varchar2(200));\n\n\n```\n\n``` 新增业务记录表\n\n\nCREATE TABLE CP.CB_RETAILER_SUB_OFFER_DTL\n(\n    ORDER_LINE_ID            NUMBER(16)   ,\n    ORDER_ID            NUMBER(16)   ,\n    IN_MODE_CODE      VARCHAR2(8) ,\n    BUSI_ITEM_CODE    VARCHAR2(32),\n    ACCESS_NUM        VARCHAR2(32),\n    BUSINESS_ID        NUMBER(20)    NOT NULL,\n    BUSI_TYPE_ID          VARCHAR2(6)   NOT NULL,\n    BUSI_TYPE_NAME        VARCHAR2(200),\n    OPERATOR_ID           VARCHAR2(10),\n    ORG_ID                NUMBER(10),\n    DONE_DATE             DATE     NOT NULL,\n    DEAL_STATUS          NUMBER(2),\n    DEAL_RESULT     VARCHAR2(500)\n) ;\n\n\n```\n\n```\n邮件标题：BOSS-2025-075-BOSS-2025-ZONG DOST Business Capability Building\n问题说明：\n修改文件：\n分支：\nfeature/20260107/retailer_sub_170|web&app&et|@ZONG DOST Business Capability Building@ZONG DOST Business Capability Building:chenyg@order\n\n```"}, {"id": 109, "origNum": "101", "title": "Busines let activeStatusFilter = 'all';

function toggleStatusFilter(status) {
  if (activeStatusFilter === status) {
    activeStatusFilter = 'all';
  } else {
    activeStatusFilter = status;
  }
  // Update visual state
  document.querySelectorAll('.status-card').forEach(card => {
    const s = card.dataset.status;
    if (s === activeStatusFilter || (activeStatusFilter === 'all' && s === 'all')) {
      card.classList.add('active');
      const info = s === 'all' ? {color: 'var(--accent)'} : statusInfo[s];
      card.style.borderColor = info.color;
    } else {
      card.classList.remove('active');
      card.style.borderColor = '';
    }
  });
  // Sync dropdown
  document.getElementById('statusFilter').value = activeStatusFilter;
  applyFilters();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderRequirements(list) {
  const container = document.getElementById('reqList');
  if (list.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div>没有匹配的需求</div>';

    const info = statusInfo[req.displayStatus];
    return `

        <span class="req-status-dot" style="background:${info.color}"></span>
        <span class="req-title">${escapeHtml(req.title)}</span>
        <span class="req-status-badge" style="color:${info.color};background:${info.bg}">${info.label}</span>

      </div>
      <div class="req-detail">
        <div class="detail-section branches">
          <div class="detail-section-title">分支信息</div>
          ${req.branches.length > 0
            ? `<div class="branch-list">${req.branches.map(b => `<div class="branch-item">${escapeHtml(b)}</div>`).join('')}</div>`
            : '<div class="no-data">无分支信息</div>'}
        </div>
        <div class="detail-section tables">
          <div class="detail-section-title">表结构变更</div>
          ${req.tableChanges.length > 0
            ? `<div class="sql-block">${escapeHtml(req.tableChanges.join('\n'))}</div>`

        </div>

            ? `<div class="sql-block">${escapeHtml(req.configParams.join('\n'))}</div>`
            : '<div class="no-data">无配置参数</div>'}
        </div>
        <div class="detail-section raw">
          <div class="detail-section-title">完整需求内容</div>
          <div class="raw-content">${escapeHtml(req.details)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleDetail(id) {
  const item = document.getElementById('req-' + id);
  item.classList.toggle('open');
}

function matchStatus(req, statusKey) {
  if (statusKey === 'all') return true;
  const info = statusInfo[statusKey];
  if (!info) return false;
  // Check the appropriate dimension field
  return req[info.field] === info.value;
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const numFilter = document.getElementById('numInput').value.trim();
  const statusFilter = document.getElementById('statusFilter').value;

  const effectiveStatus = activeStatusFilter !== 'all' ? activeStatusFilter : statusFilter;

  const filtered = requirements.filter(req => {
    // Status filter (two-dimensional)
    if (effectiveStatus !== 'all' && !matchStatus(req, effectiveStatus)) return false;

    // Number filter
    if (numFilter) {
      if (!req.origNum.includes(numFilter) && String(req.id) !== numFilter) return false;
    }

    // Keyword filter
    if (search) {
      const haystack = (
        req.title + ' ' +
        req.origNum + ' ' +
        req.details + ' ' +
        req.branches.join(' ') + ' ' +
        req.tableChanges.join(' ') + ' ' +
        req.configParams.join(' ')
      ).toLowerCase();
      if (!haystack.includes(search)) return false;
    }

    return true;
  });

  document.getElementById('resultCount').textContent = `显示 ${filtered.length} / ${requirements.length} 条`;
  renderRequirements(filtered);
}

function updateCounts() {
  // Count based on the two-dimensional model
  // live: deployStatus == live
  document.getElementById('count-live').textContent = requirements.filter(r => r.deployStatus === 'live').length;
  // not_live: deployStatus == not_live
  document.getElementById('count-not_live').textContent = requirements.filter(r => r.deployStatus === 'not_live').length;
  // dev_done: devStatus == dev_done (includes live + not_live)
  document.getElementById('count-dev_done').textContent = requirements.filter(r => r.devStatus === 'dev_done').length;
  // developing: devStatus == developing
  document.getElementById('count-developing').textContent = requirements.filter(r => r.devStatus === 'developing').length;
  // not_started: devStatus == not_started
  document.getElementById('count-not_started').textContent = requirements.filter(r => r.devStatus === 'not_started').length;
  // all
  document.getElementById('count-all').textContent = requirements.length;
}

// Initialize
updateCounts();
// Set 'all' as active by default
document.querySelector('.status-card[data-status="all"]').classList.add('active');
document.querySelector('.status-card[data-status="all"]').style.borderColor = 'var(--accent)';
applyFilters();
</script>

</body>
